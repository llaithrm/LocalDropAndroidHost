name: Build LocalDrop Pro APKs

on:
  push:
    branches: [ "main", "master", "feature/android-tv-client" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Build Host and Android TV APKs
        working-directory: LocalDropAndroidHost_cloud_build/LocalDropAndroidHost
        run: gradle --no-daemon assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-Pro-APKs
          path: |
            LocalDropAndroidHost_cloud_build/LocalDropAndroidHost/app/build/outputs/apk/debug/*.apk
            LocalDropAndroidHost_cloud_build/LocalDropAndroidHost/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
